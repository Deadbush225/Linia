name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version tag from git ref
        id: tag
        shell: bash
        run: |
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Stop if no version tag
        if: steps.tag.outputs.tag == ''
        run: |
          echo "No version tag on HEAD. Skipping release."

      - name: Set up Flutter
        if: steps.tag.outputs.tag != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
        
      - name: Set up Java
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Linux build dependencies
        if: steps.tag.outputs.tag != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libkeybinder-3.0-dev

      - name: Flutter pub get
        if: steps.tag.outputs.tag != ''
        run: flutter pub get

      - name: Prepare Android keystore
        if: steps.tag.outputs.tag != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=app/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Linux
        if: steps.tag.outputs.tag != ''
        run: flutter build linux --release

      - name: Build Android APK
        if: steps.tag.outputs.tag != ''
        run: flutter build apk --release

      - name: Package artifacts
        if: steps.tag.outputs.tag != ''
        run: |
          tar -czf linia-linux.tar.gz -C build/linux/x64/release/bundle .
          cp build/app/outputs/flutter-apk/app-release.apk linia-android.apk

      - name: Publish GitHub release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Linia ${{ steps.tag.outputs.tag }}
          files: |
            linia-linux.tar.gz
            linia-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
